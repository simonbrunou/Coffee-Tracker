name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coffee_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coffee_tracker_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Schema/migration drift check
        run: |
          npx drizzle-kit generate --name ci_drift_check
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::lib/db/schema.ts drifted from the committed migration. Run 'npx drizzle-kit generate' and commit."
            git --no-pager diff --stat drizzle/ && git status --porcelain drizzle/
            exit 1
          fi
      - name: Migrate test DB
        run: npm run db:setup
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          # Not a secret — only suppresses a next-auth v5 build-time warning.
          # next build is force-dynamic (no prerender), pg.Pool is lazy, and auth
          # reads no env at module scope, so the build needs no DB and no real secrets.
          AUTH_SECRET: "ci-build-placeholder-not-a-secret"
