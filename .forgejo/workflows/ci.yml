# Runs on the self-hosted Forgejo (git.sbrn.eu), the source of truth; the GitHub
# repository is a push mirror and runs no CI. Jobs run in containers on the
# self-hosted runner, so the Postgres service is reached by its name, not on
# localhost through a published port (a published port would also collide
# between two concurrent jobs).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coffee_tracker_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/coffee_tracker_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Schema/migration drift check
        run: |
          npx drizzle-kit generate --name ci_drift_check
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::lib/db/schema.ts drifted from the committed migration. Run 'npx drizzle-kit generate' and commit."
            git --no-pager diff --stat drizzle/ && git status --porcelain drizzle/
            exit 1
          fi
      - name: Migrate test DB
        run: npm run db:setup
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          # Not a secret — only suppresses a next-auth v5 build-time warning.
          # next build is force-dynamic (no prerender), pg.Pool is lazy, and auth
          # reads no env at module scope, so the build needs no DB and no real secrets.
          AUTH_SECRET: "ci-build-placeholder-not-a-secret"

  docker:
    name: Docker build (smoke test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coffee_tracker_smoke
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The job drives the runner CT's Docker daemon, shared by every job on the
      # runner. Names carry the run id so two concurrent runs never collide, and
      # the attempt so a re-run never shares them with an earlier attempt of its
      # run: an attempt the runner lost runs no cleanup step and leaves its
      # container and image behind, and one cut off from the forge can still be
      # running when the re-run starts. Forgejo numbers run_attempt per job, not
      # per run: re-running only this job makes it 2 while the other jobs stay
      # at 1. Copied from diversif's `docker-build` job (diversif#697).
      SMOKE_IMAGE: coffee-tracker:ci-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_CONTAINER: coffee-tracker-smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Remove what earlier attempts of this run left behind, by name. The names
      # are this attempt's with its number swapped out. Each check matches the
      # exact name: Docker's name filter matches a substring, so attempt 1's
      # check would also list attempt 10's. The image goes by tag, never by ID:
      # a push run and a pull_request run of one SHA build the same image ID.
      # `shell: bash` runs the text as `bash --noprofile --norc -e -o pipefail`,
      # so a failed docker call fails the step once the ERR trap has named the
      # attempt. test/ci-docker-smoke.test.ts runs this text against a stub docker.
      - name: Remove earlier attempts' container and image
        shell: bash
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          case "$RUN_ATTEMPT" in
            '' | 0* | *[!0-9]*)
              echo "::error::github.run_attempt is '$RUN_ATTEMPT', not a positive integer, so the smoke container and image names do not tell this run's attempts apart"
              exit 1
              ;;
          esac
          container_base=${SMOKE_CONTAINER%-"$RUN_ATTEMPT"}
          image_base=${SMOKE_IMAGE%-"$RUN_ATTEMPT"}
          if [ "$container_base" = "$SMOKE_CONTAINER" ] || [ "$image_base" = "$SMOKE_IMAGE" ]; then
            echo "::error::SMOKE_CONTAINER ($SMOKE_CONTAINER) and SMOKE_IMAGE ($SMOKE_IMAGE) must both end in -$RUN_ATTEMPT"
            exit 1
          fi
          if [ "$RUN_ATTEMPT" = 1 ]; then
            echo "This is attempt 1: no earlier attempt to clean up"
          fi
          trap 'echo "::error::a docker call failed while removing what attempt $n of this run left"' ERR
          for ((n = 1; n < RUN_ATTEMPT; n++)); do
            container="$container_base-$n"
            image="$image_base-$n"
            found=$(docker ps --all --quiet --filter "name=^/$container\$")
            if [ -n "$found" ]; then
              docker rm --force "$container" >/dev/null
              container_state=removed
            else
              container_state=absent
            fi
            found=$(docker images --quiet "$image")
            if [ -n "$found" ]; then
              docker image rm --force "$image" >/dev/null
              image_state=removed
            else
              image_state=absent
            fi
            echo "Attempt $n: container $container $container_state, image $image $image_state"
          done
      - run: docker build --check .
      - run: docker build --tag "$SMOKE_IMAGE" .
      # The container joins this job container's network namespace instead of
      # publishing a port: a published port would land on the runner CT, not
      # here. Sharing the namespace keeps 127.0.0.1:3000 local, and the
      # `postgres` service name resolves as it does in this job. The secret and
      # URL are CI-only placeholders that the production env check requires.
      - name: Start the built image against the job's Postgres
        run: |
          echo "Starting container $SMOKE_CONTAINER from image $SMOKE_IMAGE"
          docker run --detach --name "$SMOKE_CONTAINER" --network "container:$(hostname)" \
            -e DATABASE_URL=postgresql://postgres:postgres@postgres:5432/coffee_tracker_smoke \
            -e AUTH_SECRET=ci-only-not-a-real-auth-secret \
            -e AUTH_URL=http://127.0.0.1:3000/ \
            "$SMOKE_IMAGE"
      # The container runs the migrations, then the server. The probe waits up
      # to 60 tries, 1 s apart, for /api/health, and fails at once if the
      # container stops (a failed migration exits it). Then it fetches a PWA
      # icon from public/ and a script that /login links under /_next/static,
      # which /api/health alone would not miss. test/ci-docker-smoke.test.ts
      # runs this text against a stub docker and curl.
      - name: Probe /api/health and the static assets
        shell: bash
        run: |
          base=http://127.0.0.1:3000
          body=
          for ((try = 1; try <= 60; try++)); do
            running=$(docker inspect --format '{{.State.Running}}' "$SMOKE_CONTAINER")
            if [ "$running" != true ]; then
              echo "::error::container $SMOKE_CONTAINER stopped before /api/health answered"
              exit 1
            fi
            if body=$(curl --fail --silent --max-time 5 "$base/api/health"); then
              break
            fi
            body=
            sleep 1
          done
          if [ -z "$body" ]; then
            echo "::error::/api/health did not answer within 60 tries"
            exit 1
          fi
          if [ "$body" != '{"ok":true}' ]; then
            echo "::error::/api/health answered '$body', not {\"ok\":true}"
            exit 1
          fi
          echo "/api/health answered $body after $try tries"
          # curl --fail passes a 3xx, so each asset check reads the status too.
          if ! answer=$(curl --fail --silent --max-time 10 --output /dev/null --write-out '%{http_code} %{content_type}' "$base/icons/icon-192.png"); then
            echo "::error::/icons/icon-192.png did not answer 2xx"
            exit 1
          fi
          if [ "$answer" != "200 image/png" ]; then
            echo "::error::/icons/icon-192.png answered '$answer', not 200 image/png"
            exit 1
          fi
          echo "/icons/icon-192.png answered $answer"
          if ! html=$(curl --fail --silent --max-time 10 "$base/login"); then
            echo "::error::/login did not answer 2xx"
            exit 1
          fi
          if ! [[ $html =~ /_next/static/[^\"]+\.js ]]; then
            echo "::error::/login links no script under /_next/static"
            exit 1
          fi
          script=${BASH_REMATCH[0]}
          if ! answer=$(curl --fail --silent --max-time 10 --output /dev/null --write-out '%{http_code} %{content_type}' "$base$script"); then
            echo "::error::$script did not answer 2xx"
            exit 1
          fi
          case "$answer" in
            "200 application/javascript" | "200 application/javascript;"*) ;;
            *)
              echo "::error::$script answered '$answer', not 200 application/javascript"
              exit 1
              ;;
          esac
          echo "$script answered $answer"
      - name: Container logs, then remove the smoke container and image
        if: always()
        run: |
          docker logs "$SMOKE_CONTAINER" || true
          docker rm --force "$SMOKE_CONTAINER" || true
          docker image rm --force "$SMOKE_IMAGE" || true
